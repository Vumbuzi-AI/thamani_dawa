info:
  name: Lab facility search — Cerba Lancet
  type: http
  seq: 3

http:
  method: GET
  url: "{{labBaseUrl}}/labsverification/licence_records.php"
  params:
    - {name: search, value: "{{labFacilityName}}", type: query}
    - {name: filter, value: "", type: query}
    - {name: value, value: "", type: query}
    - {name: sort, value: Name, type: query}
    - {name: order, value: ASC, type: query}
    - {name: page, value: "1", type: query}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Search the KMLTTB public laboratory facilities register — a separate host and board from PPB. Change the collection variable `labFacilityName` to search for another laboratory.
