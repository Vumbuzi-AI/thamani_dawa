info:
  name: Distributor search — Abacus Pharma
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/ajax/public"
  params:
    - {name: fetch, value: facilities, type: query}
    - {name: ftype, value: wholesale, type: query}
    - {name: draw, value: "1", type: query}
    - {name: start, value: "0", type: query}
    - {name: length, value: "15", type: query}
    - {name: "search[value]", value: "{{distributorName}}", type: query}
    - {name: "search[regex]", value: "false", type: query}
    - {name: "columns[0][data]", value: "0", type: query}
    - {name: "columns[0][name]", value: "", type: query}
    - {name: "columns[0][searchable]", value: "true", type: query}
    - {name: "columns[0][orderable]", value: "true", type: query}
    - {name: "columns[0][search][value]", value: "", type: query}
    - {name: "columns[0][search][regex]", value: "false", type: query}
    - {name: "columns[1][data]", value: "1", type: query}
    - {name: "columns[1][name]", value: "", type: query}
    - {name: "columns[1][searchable]", value: "true", type: query}
    - {name: "columns[1][orderable]", value: "true", type: query}
    - {name: "columns[1][search][value]", value: "", type: query}
    - {name: "columns[1][search][regex]", value: "false", type: query}
    - {name: "columns[2][data]", value: "2", type: query}
    - {name: "columns[2][name]", value: "", type: query}
    - {name: "columns[2][searchable]", value: "true", type: query}
    - {name: "columns[2][orderable]", value: "true", type: query}
    - {name: "columns[2][search][value]", value: "", type: query}
    - {name: "columns[2][search][regex]", value: "false", type: query}
    - {name: "columns[3][data]", value: "3", type: query}
    - {name: "columns[3][name]", value: "", type: query}
    - {name: "columns[3][searchable]", value: "true", type: query}
    - {name: "columns[3][orderable]", value: "true", type: query}
    - {name: "columns[3][search][value]", value: "", type: query}
    - {name: "columns[3][search][regex]", value: "false", type: query}
    - {name: "order[0][column]", value: "0", type: query}
    - {name: "order[0][dir]", value: asc, type: query}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Change the collection variable `distributorName` to search for another wholesale distributor.
